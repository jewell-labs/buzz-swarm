[workspace]
resolver = "2"
members = [
    "crates/swarm-core",
    "crates/swarm-cli",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
authors = ["Jewell Labs contributors"]
repository = "https://github.com/jewell-labs/buzz-swarm"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
dirs = "6"
